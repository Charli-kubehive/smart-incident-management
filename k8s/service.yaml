apiVersion: v1
kind: Service
metadata:
  name: employee-backend
spec:
  type: NodePort
  selector:
    app: employee-backend
  ports:
    - port: 8088
      targetPort: 8088
---
apiVersion: v1
kind: Service
metadata:
  name: employee-frontend
spec:
  type: NodePort
  selector:
    app: employee-frontend
  ports:
    - port: 80
      targetPort: 80